
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Новости и события — Оксана Соло</title>

    <meta name="description" content="Новости книги, путешествий и проектов Оксаны Соло">

    <link rel="stylesheet" href="/css/main.css">

    <style>
        /* =================================
           СТРАНИЦА НОВОСТЕЙ
        ================================= */

        .public-news-page {
            background: #f7f4ef;
            color: #302c28;
            min-height: 100vh;
        }

        .news-public-shell {
            width: min(1100px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 80px;
        }

        .public-news-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e7dfd5;
        }

        .public-news-top a {
            color: #55483d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color .2s;
        }

        .public-news-top a:hover {
            color: #a76d43;
        }

        .public-news-top .brand {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #302c28;
        }

        .public-news-heading {
            padding: 65px 0 40px;
            text-align: center;
        }

        .news-kicker {
            display: inline-block;
            margin-bottom: 15px;
            color: #a76d43;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .public-news-heading h1 {
            margin: 0 0 15px;
            font-size: clamp(32px, 5vw, 52px);
            line-height: 1.12;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .public-news-heading p {
            max-width: 550px;
            margin: 0 auto;
            color: #81766d;
            font-size: 16px;
            line-height: 1.7;
        }

        /* АРХИВ */

        .news-archive {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .public-news-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            border: 1px solid #ece5dc;
            border-radius: 17px;
            box-shadow: 0 5px 22px rgba(65, 48, 34, .045);
            transition: transform .25s, box-shadow .25s;
        }

        .public-news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(65, 48, 34, .10);
        }

        .public-news-card-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #eee8df;
        }

        .public-news-card-no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #eee4d8, #e4d5c3);
            color: #a18469;
            font-size: 40px;
        }

        .public-news-card-body {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: flex-start;
            padding: 24px;
        }

        .public-news-date {
            margin-bottom: 12px;
            color: #a77a56;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .public-news-card h2 {
            margin: 0 0 12px;
            color: #302c28;
            font-size: 22px;
            line-height: 1.35;
            font-weight: 700;
        }

        .public-news-excerpt {
            display: -webkit-box;
            overflow: hidden;
            margin: 0 0 22px;
            color: #81766d;
            font-size: 14px;
            line-height: 1.7;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        .public-news-read {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: auto;
            padding: 11px 18px;
            border: 1px solid #d9c5b1;
            border-radius: 9px;
            background: #f8f3ed;
            color: #78563d;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: all .2s;
        }

        .public-news-read:hover {
            background: #a77a56;
            border-color: #a77a56;
            color: #fff;
        }

        /* ПОЛНАЯ НОВОСТЬ */

        .public-article {
            max-width: 850px;
            margin: 0 auto;
            padding-top: 45px;
        }

        .article-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 35px;
            color: #8b6a4e;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: color .2s;
        }

        .article-back:hover {
            color: #bd8051;
        }

        .article-date {
            margin-bottom: 17px;
            color: #a77a56;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .article-title {
            margin: 0 0 28px;
            color: #302c28;
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.2;
            letter-spacing: -1px;
            overflow-wrap: anywhere;
        }

        .article-image {
            display: block;
            width: 100%;
            max-height: 550px;
            margin-bottom: 35px;
            border-radius: 16px;
            object-fit: cover;
            background: #eee8df;
        }

        .article-content {
            color: #494139;
            font-size: 17px;
            line-height: 1.95;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .article-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 55px;
            padding-top: 25px;
            border-top: 1px solid #e7dfd5;
        }

        .article-footer p {
            margin: 0;
            color: #9a8d80;
            font-size: 13px;
        }

        .article-footer a {
            color: #a77a56;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        /* СОСТОЯНИЯ */

        .empty-state {
            grid-column: 1 / -1;
            padding: 55px 20px;
            border: 1px dashed #d9cabb;
            border-radius: 15px;
            color: #8d8176;
            text-align: center;
            line-height: 1.7;
        }

        .news-error {
            color: #a34e43;
        }

        .news-loading {
            padding: 45px 20px;
            color: #8d8176;
            text-align: center;
        }

        .news-hidden {
            display: none !important;
        }

        /* ТЕЛЕФОНЫ */

        @media (max-width: 650px) {
            .news-public-shell {
                width: calc(100% - 28px);
                padding-top: 18px;
            }

            .public-news-top {
                padding-bottom: 18px;
            }

            .public-news-top .brand {
                font-size: 16px;
            }

            .public-news-top a:last-child {
                font-size: 12px;
            }

            .public-news-heading {
                padding: 45px 0 30px;
            }

            .public-news-heading p {
                font-size: 14px;
            }

            .news-archive {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .public-news-card-body {
                padding: 20px;
            }

            .public-news-card h2 {
                font-size: 20px;
            }

            .public-article {
                padding-top: 30px;
            }

            .article-title {
                font-size: 30px;
            }

            .article-content {
                font-size: 15px;
                line-height: 1.85;
            }

            .article-image {
                border-radius: 12px;
                margin-bottom: 25px;
            }

            .article-footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body class="public-news-page">

<main class="news-public-shell">

    <header class="public-news-top">
        <a href="/" class="brand">ОКСАНА СОЛО</a>
        <a href="/">На главную ←</a>
    </header>

    <!-- ЗАГОЛОВОК АРХИВА -->
    <section class="public-news-heading" id="archive-heading">
        <span class="news-kicker">ЖИЗНЬ ПРОЕКТА</span>
        <h1>Новости и события</h1>
        <p>Самое интересное о книге, путешествиях и новых проектах.</p>
    </section>

    <!-- АРХИВ НОВОСТЕЙ -->
    <div id="news-archive" class="news-archive">
        <p class="news-loading">Загружаем новости…</p>
    </div>

    <!-- ПОЛНАЯ НОВОСТЬ -->
    <article id="full-article" class="public-article news-hidden"></article>

</main>

<script>
(() => {
    const archive = document.getElementById("news-archive");
    const heading = document.getElementById("archive-heading");
    const article = document.getElementById("full-article");

    // Безопасное отображение текста.
    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]);
    }

    // Форматирование даты.
    function formatDate(value) {
        if (!value) return "";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) return "";

        return date.toLocaleDateString("ru-RU", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });
    }

    // Определяем, открыта ли конкретная новость.
    function getSlugFromPath() {
        const match = window.location.pathname.match(/^\/news\/([^/]+)\/?$/);

        if (!match) return null;

        try {
            return decodeURIComponent(match[1]);
        } catch {
            return match[1];
        }
    }

    // Показываем архив.
    async function loadArchive() {
        article.classList.add("news-hidden");
        archive.classList.remove("news-hidden");
        heading.classList.remove("news-hidden");

        document.title = "Новости и события — Оксана Соло";

        archive.innerHTML = '<p class="news-loading">Загружаем новости…</p>';

        try {
            const response = await fetch("/api/news");

            if (!response.ok) {
                throw new Error("Не удалось загрузить новости.");
            }

            const news = await response.json();

            if (!Array.isArray(news) || news.length === 0) {
                archive.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size:36px;margin-bottom:12px;">✦</div>
                        <strong>Пока здесь тихо</strong>
                        <p>Новые новости и события скоро появятся.</p>
                    </div>
                `;
                return;
            }

            archive.innerHTML = news.map(item => {
                const image = item.image
                    ? `<img class="public-news-card-image"
                            src="${escapeHTML(item.image)}"
                            alt="${escapeHTML(item.title)}"
                            loading="lazy"
                            onerror="this.outerHTML='<div class=&quot;public-news-card-no-image&quot;>✦</div>'">`
                    : '<div class="public-news-card-no-image">✦</div>';

                return `
                    <article class="public-news-card">
                        ${image}

                        <div class="public-news-card-body">
                            <div class="public-news-date">
                                ${escapeHTML(formatDate(item.published_at || item.created_at))}
                            </div>

                            <h2>${escapeHTML(item.title)}</h2>

                            <p class="public-news-excerpt">
                                ${escapeHTML(item.excerpt || "Подробнее об этом событии читайте в полной новости.")}
                            </p>

                            <a class="public-news-read"
                               href="/news/${encodeURIComponent(item.slug)}"
                               data-news-slug="${escapeHTML(item.slug)}">
                                Читать полностью →
                            </a>
                        </div>
                    </article>
                `;
            }).join("");

        } catch (error) {
            console.error("Ошибка загрузки архива:", error);

            archive.innerHTML = `
                <div class="empty-state news-error">
                    Не удалось загрузить новости.
                    <br>Попробуй обновить страницу немного позже.
                </div>
            `;
        }
    }

    // Открываем полную новость.
    async function loadArticle(slug) {
        archive.classList.add("news-hidden");
        heading.classList.add("news-hidden");
        article.classList.remove("news-hidden");

        article.innerHTML = '<p class="news-loading">Открываем новость…</p>';

        try {
            const response = await fetch(
                "/api/news/" + encodeURIComponent(slug)
            );

            if (response.status === 404) {
                throw new Error("Эта новость не найдена или больше не опубликована.");
            }

            if (!response.ok) {
                throw new Error("Не удалось загрузить новость.");
            }

            const item = await response.json();

            document.title = escapeHTML(item.title) + " — Оксана Соло";

            const image = item.image
                ? `<img class="article-image"
                        src="${escapeHTML(item.image)}"
                        alt="${escapeHTML(item.title)}"
                        onerror="this.style.display='none'">`
                : "";

            article.innerHTML = `
                <a href="/news" class="article-back" data-back-to-archive>
                    ← Все новости
                </a>

                <div class="article-date">
                    ${escapeHTML(formatDate(item.published_at || item.created_at))}
                </div>

                <h1 class="article-title">
                    ${escapeHTML(item.title)}
                </h1>

                ${image}

                <div class="article-content">${escapeHTML(item.content || "")}</div>

                <div class="article-footer">
                    <p>Оксана Соло · Новости и события</p>
                    <a href="/news" data-back-to-archive>← Вернуться в архив</a>
                </div>
            `;

            window.scrollTo({ top: 0, behavior: "smooth" });

        } catch (error) {
            console.error("Ошибка открытия новости:", error);

            document.title = "Новость — Оксана Соло";

            article.innerHTML = `
                <a href="/news" class="article-back" data-back-to-archive>
                    ← Все новости
                </a>

                <div class="empty-state news-error">
                    ${escapeHTML(error.message)}
                </div>
            `;
        }
    }

    // Переходы между архивом и новостями без перезагрузки.
    document.addEventListener("click", event => {
        const newsLink = event.target.closest("[data-news-slug]");
        const backLink = event.target.closest("[data-back-to-archive]");

        if (newsLink) {
            event.preventDefault();

            const slug = newsLink.dataset.newsSlug;

            history.pushState({}, "", newsLink.href);
            loadArticle(slug);
        }

        if (backLink) {
            event.preventDefault();

            history.pushState({}, "", "/news");
            loadArchive();

            window.scrollTo({ top: 0, behavior: "smooth" });
        }
    });

    // Обработка кнопок браузера «Назад» и «Вперёд».
    window.addEventListener("popstate", () => {
        const slug = getSlugFromPath();

        if (slug) {
            loadArticle(slug);
        } else {
            loadArchive();
        }
    });

    // При первом открытии определяем нужный режим.
    const initialSlug = getSlugFromPath();

    if (initialSlug) {
        loadArticle(initialSlug);
    } else {
        loadArchive();
    }
})();
</script>

</body>
</html>
